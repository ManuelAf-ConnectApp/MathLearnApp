{% load static i18n %}<!doctype html>
<html lang="{{ LANGUAGE_CODE }}"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#075bb5"><title>{% block title %}MathLearnApp{% endblock %}</title><link rel="manifest" href="{% static 'learning/manifest.webmanifest' %}"><link rel="stylesheet" href="{% static 'learning/app.css' %}"></head>
<body{% if high_contrast %} class="high-contrast"{% endif %}><a class="skip" href="#main">Saltar al contenido</a><header><a class="brand" href="{% url 'operations' %}"><img src="{% static 'learning/logo.png' %}" alt="MathLearnApp"></a>{% if age %}<nav><span>Edad: {{ age }}</span><a href="{% url 'dashboard' %}">Mi progreso</a><a href="{% url 'age' %}">Cambiar edad</a></nav>{% endif %}<form class="language" action="{% url 'set_language' %}" method="post">{% csrf_token %}<input name="next" type="hidden" value="{{ request.get_full_path }}"><label for="language">Idioma</label><select id="language" name="language" onchange="this.form.submit()"><option value="es"{% if LANGUAGE_CODE == 'es' %} selected{% endif %}>ES</option><option value="en"{% if LANGUAGE_CODE == 'en' %} selected{% endif %}>EN</option><option value="ca"{% if LANGUAGE_CODE == 'ca' %} selected{% endif %}>CA</option></select></form></header><main id="main">{% block content %}{% endblock %}</main><script>{if('serviceWorker' in navigator)navigator.serviceWorker.register('{% url "service_worker" %}')}</script></body></html>
